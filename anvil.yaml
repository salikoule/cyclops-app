allow_embedding: false
db_schema:
  item_categories:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: item_type, type: string}
    - {name: role, type: string}
    server: full
    title: Item categories
  items:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: item_type, type: string}
    - {name: category, target: item_categories, type: link_single}
    - {name: unit, target: units, type: link_single}
    - {name: erp_code, type: string}
    - {name: approved_machines, target: machines, type: link_multiple}
    - {name: supplier, type: string}
    - {name: properties, type: simpleObject}
    - {name: status, type: string}
    - {name: notes, type: string}
    server: full
    title: Items
  lots:
    client: none
    columns:
    - {name: code, type: string}
    - {name: number, type: string}
    - {name: item, target: items, type: link_single}
    - {name: origin, type: string}
    - {name: run, target: production_runs, type: link_single}
    - {name: supplier_lot, type: string}
    - {name: received_at, type: datetime}
    - {name: quantity, type: number}
    - {name: status, type: string}
    - {name: notes, type: string}
    server: full
    title: Lots
  machine_types:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    server: full
    title: Machine types
  machines:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: alias, type: string}
    - {name: machine_type, target: machine_types, type: link_single}
    - {name: attached_to, target: machines, type: link_single}
    - {name: floor_number, type: number}
    - {name: serial, type: string}
    - {name: euromap, type: string}
    - {name: year, type: string}
    - {name: changeover_min, type: number}
    - {name: location, type: string}
    - {name: status, type: string}
    - {name: notes, type: string}
    server: full
    title: Machines
  molds:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: cavities, type: number}
    - {name: shot_weight_g, type: number}
    - {name: location, type: string}
    - {name: status, type: string}
    - {name: notes, type: string}
    server: full
    title: Molds
  person_roles:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: runs_machines, type: bool}
    - {name: status, type: string}
    server: full
    title: Person roles
  personnel:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: role, target: person_roles, type: link_single}
    - {name: status, type: string}
    - {name: qualified_machines, target: machines, type: link_multiple}
    server: full
    title: Personnel
  production_orders:
    client: none
    columns:
    - {name: code, type: string}
    - {name: item, target: items, type: link_single}
    - {name: quantity, type: number}
    - {name: due_date, type: date}
    - {name: status, type: string}
    - {name: erp_order_no, type: string}
    - {name: notes, type: string}
    server: full
    title: Production orders
  production_runs:
    client: none
    columns:
    - {name: code, type: string}
    - {name: order, target: production_orders, type: link_single}
    - {name: recipe, target: recipes, type: link_single}
    - {name: shift, target: shifts, type: link_single}
    - {name: operator, target: personnel, type: link_single}
    - {name: started_at, type: datetime}
    - {name: ended_at, type: datetime}
    - {name: good_qty, type: number}
    - {name: cavities_running, type: number}
    - {name: cycle_s, type: number}
    - {name: status, type: string}
    - {name: notes, type: string}
    server: full
    title: Production runs
  recipe_inputs:
    client: none
    columns:
    - {name: recipe, target: recipes, type: link_single}
    - {name: item, target: items, type: link_single}
    - {name: share_pct, type: number}
    server: full
    title: Recipe inputs
  recipes:
    client: none
    columns:
    - {name: code, type: string}
    - {name: item, target: items, type: link_single}
    - {name: mold, target: molds, type: link_single}
    - {name: machine, target: machines, type: link_single}
    - {name: status, type: string}
    - {name: standard, type: bool}
    - {name: cycle_s, type: number}
    - {name: temps, type: simpleObject}
    - {name: injection, type: simpleObject}
    - {name: extra, type: simpleObject}
    - {name: settings_note, type: string}
    - {name: comment, type: string}
    server: full
    title: Recipes
  run_inputs:
    client: none
    columns:
    - {name: run, target: production_runs, type: link_single}
    - {name: lot, target: lots, type: link_single}
    - {name: quantity, type: number}
    server: full
    title: Run inputs
  run_scrap:
    client: none
    columns:
    - {name: run, target: production_runs, type: link_single}
    - {name: reason, target: scrap_reasons, type: link_single}
    - {name: quantity, type: number}
    server: full
    title: Run scrap
  scrap_reasons:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: category, type: string}
    - {name: status, type: string}
    server: full
    title: Scrap reasons
  shifts:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: start_time, type: string}
    - {name: end_time, type: string}
    - {name: status, type: string}
    server: full
    title: Shifts
  stoppage_causes:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: category, type: string}
    - {name: planned, type: bool}
    - {name: status, type: string}
    server: full
    title: Stoppage causes
  stoppages:
    client: none
    columns:
    - {name: code, type: string}
    - {name: machine, target: machines, type: link_single}
    - {name: run, target: production_runs, type: link_single}
    - {name: started_at, type: datetime}
    - {name: ended_at, type: datetime}
    - {name: cause, target: stoppage_causes, type: link_single}
    - {name: description, type: string}
    - {name: fix, type: string}
    - {name: reported_by, target: personnel, type: link_single}
    server: full
    title: Stoppages
  units:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: status, type: string}
    server: full
    title: Units
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: email
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: true
      name: enabled
      type: bool
    - admin_ui: {order: 2, width: 200}
      client_hidden: true
      name: last_login
      type: datetime
    - admin_ui: {order: 3, width: 200}
      client_hidden: true
      name: password_hash
      type: string
    - admin_ui: {order: 4, width: 200}
      client_hidden: true
      name: n_password_failures
      type: number
    - admin_ui: {order: 5, width: 200}
      client_hidden: true
      name: signed_up
      type: datetime
    - admin_ui: {order: 6, width: 200}
      client_hidden: true
      name: remembered_logins
      type: simpleObject
    - admin_ui: {order: 7, width: 200}
      client_hidden: true
      name: confirmed_email
      type: bool
    indexes: []
    server: full
    title: Users
dependencies:
- dep_id: dep_wkevhfjmozeq0f
  resolution_hints: {app_id: ST3GINETRT4QJYDC, name: craftify-library, package_name: craftify_library}
  version: {branch: master}
metadata: {description: Cyclops production records, title: Cyclops}
name: cyclops_app
native_deps:
  head_html: |
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/treant-js@1.0.1/Treant.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="_/theme/echarts_theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/treant-js@1.0.1/vendor/raphael.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/treant-js@1.0.1/Treant.js"></script>
    <script src="_/theme/cyclops-tree.js"></script>
    <script>
    (function () {
      try {
        var stored = localStorage.getItem("craftify-theme") || "light";
        var dark = stored === "dark" || (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("ipac-dark", dark);
        document.documentElement.classList.toggle("craftify-theme-dark", dark);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
    </script>
    <link rel="stylesheet" href="_/theme/craftify-full-theme.css">
    <link rel="stylesheet" href="_/theme/tabulator_styles.css">
    <link rel="stylesheet" href="_/theme/coach.css">
    <link rel="stylesheet" href="_/theme/craftify-theme.css">
    <link rel="stylesheet" href="_/theme/cyclops.css">
package_name: cyclops_app
runtime_options:
  client_version: '3'
  server_spec: {base: python312}
  version: 3
services:
- client_config: {enable_split: true, enable_v2: true}
  server_config: {auto_create_missing_columns: true}
  source: /runtime/services/tables.yml
- client_config: {allow_remember_me: true, allow_signup: true, confirm_email: true, enable_automatic_sign_in: true, mfa_timeout_days: 0, remember_me_days: 30, require_mfa: false, use_email: true, use_google: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup: {module: launch, type: module}
startup_form: null
