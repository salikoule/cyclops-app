<style>
  .ts-page {
    --navy: #1e3a5f;
    --muted: #64748b;
    --line: #e2e8f0;
    --font: Montserrat, system-ui, sans-serif;
    font-family: var(--font);
    color: #0f172a;
    width: 100%;
    margin: 0;
  }
  .ts-page,
  .ts-page * { box-sizing: border-box; }

  .anvil-html-component:has(.ts-page),
  .anvil-html-component:has(.ts-page) > .anvil-html-content {
    padding: 0 !important;
    margin: 0 !important;
    max-width: none !important;
    width: 100% !important;
    background: transparent !important;
  }

  .ts-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .ts-head {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 16px 12px;
    border-bottom: 1px solid #f1f5f9;
  }
  .ts-titles { flex: 1 1 240px; min-width: 0; }
  .ts-head h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 650;
    color: var(--navy);
  }
  .ts-head p {
    margin: 3px 0 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.45;
  }
  .ts-actions {
    margin-left: auto;
    flex: 0 0 auto;
  }
  .ts-actions > .anvil-component,
  .ts-actions .anvil-container {
    width: auto !important;
    max-width: none !important;
  }
  .ts-body { width: 100%; }
  .ts-body.is-padded { padding: 14px 16px 16px; }
  .ts-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 16px 14px;
    border-top: 1px solid #f1f5f9;
    background: #f8fafc;
  }
  .ts-foot:empty { display: none; }
  .ts-foot .anvil-component,
  .ts-foot .anvil-container { width: auto !important; max-width: none !important; }
  .ts-card.is-lead .ts-head { padding: 18px 20px 14px; align-items: flex-start; }
  .ts-card.is-lead .ts-head h3 { font-size: 22px; letter-spacing: -0.02em; line-height: 1.2; }
  .ts-card.is-lead .ts-head p { margin-top: 6px; font-size: 13px; line-height: 1.5; max-width: 760px; }
  .ts-head p:empty { display: none; }
  .ts-actions:empty { display: none; }
</style>
<div class="ts-page">
  <div class="ts-card" anvil-name="card">
    <div class="ts-head">
      <div class="ts-titles">
        <h3 anvil-name="title"></h3>
        <p anvil-name="subtitle"></p>
      </div>
      <div class="ts-actions" anvil-slot="actions"></div>
    </div>
    <div class="ts-body" anvil-name="body" anvil-slot="body"></div>
    <div class="ts-foot" anvil-name="foot" anvil-slot="foot"></div>
  </div>
</div>
