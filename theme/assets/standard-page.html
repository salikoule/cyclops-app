<link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" rel="stylesheet" rel="preload" as="font" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;500;600;650;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<a class="sidebar-toggle" anvil-hide-if-slot-empty="left-nav" href="javascript:void(0)"><i class="fa fa-bars"></i></a>

<div class="structure">
  <div class="app-bar" anvil-drop-container=".anvil-container" anvil-drop-redirect=".placeholder">
    <a class="sidebar-toggle anvil-designer-only" anvil-if-slot-empty="top-left-btn" anvil-drop-slot="top-left-btn"><i class="fa fa-blank"></i></a>
    <div class="top-left-btn" anvil-slot="top-left-btn"></div>
    <div class="title" anvil-slot="title">
      <div class="placeholder anvil-designer-only" anvil-if-slot-empty="title" anvil-drop-here>Drop title here</div>
    </div>
    <div style="clear:both"></div>
  </div>

  <div class="nav-holder">
    <div class="left-nav anvil-measure-this">
      <button type="button" class="nav-collapse" title="Collapse menu" aria-label="Collapse menu">‹</button>
      <div class="left-nav-main" anvil-slot-repeat="left-nav" anvil-drop-container=">.anvil-container"></div>
      <div class="left-nav-placeholder anvil-designer-only" anvil-if-slot-empty="left-nav" anvil-drop-slot="left-nav">
        <div class="prompt">To add a sidebar, drop a ColumnPanel here.</div>
      </div>
      <div class="left-nav-footer" anvil-slot="nav-right">
        <div class="placeholder anvil-designer-only" anvil-if-slot-empty="nav-right" anvil-drop-here>Drop sidebar actions here</div>
      </div>
    </div>

    <div class="content">
      <div anvil-slot-repeat="default" class="anvil-measure-this"></div>
      <div class="placeholder drop-here" anvil-if-slot-empty="default" anvil-drop-slot="default">Drop a ColumnPanel here.</div>
    </div>
  </div>
  <div class="nav-shield"></div>
</div>
<div anvil-drop-default anvil-drop-redirect=".placeholder" anvil-drop-container=".anvil-container"></div>

<script>
  function hideSidebar() {
    var ln = $('.structure > .nav-holder > .left-nav');
    ln.animate({left: -ln.outerWidth()}, function() {
      ln.removeClass("in-transition shown").addClass("hidden");
      $('.nav-shield').removeClass("shown");
      $(window).trigger('resize');
    });
  }
  function showSidebar() {
    var ln = $('.structure > .nav-holder > .left-nav');
    $('.nav-shield').addClass("shown");
    ln.addClass("shown").removeClass("hidden").css({left: "-100%"}).css({left: -ln.outerWidth()}).animate({left: 0}, function() {
      ln.removeClass("in-transition");
    });
    $(window).trigger('resize');
  }
  $('.sidebar-toggle, .nav-shield').off('click').on('click', function() {
    var ln = $('.structure > .nav-holder > .left-nav');
    if (ln.is(":visible") || $('.nav-shield').is(".shown")) {
      hideSidebar();
    } else if(!ln.is(":empty")) {
      showSidebar();
    }
  });
  $('.left-nav').off('click').on('click', 'a, button', function() {
    if ($(this).closest('.nav-collapse, .am-wrap').length) {
      return;
    }
    if ($('.nav-shield').is(":visible")) {
      $('.nav-shield').trigger('click');
    }
  });
  $(document).off('click.amMenu').on('click.amMenu', function(e) {
    if ($(e.target).closest('.am-wrap').length) {
      return;
    }
    $('.am-wrap.am-open').removeClass('am-open').find('.am-menu').addClass('am-off');
  });
  function labelNavLinks() {
    $('.left-nav-main a').each(function() {
      var $a = $(this);
      var text = ($a.find('.link-text').first().text() || $a.text() || '').replace(/\s+/g, ' ').trim();
      if (!text) {
        return;
      }
      $a.attr('data-nav-label', text);
      $a.attr('aria-label', text);
      $a.removeAttr('title');
    });
  }
  $('.nav-collapse').off('click').on('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    $('.structure').toggleClass('nav-collapsed');
    var collapsed = $('.structure').hasClass('nav-collapsed');
    $(this).attr('title', collapsed ? 'Expand menu' : 'Collapse menu');
    $(this).attr('aria-label', collapsed ? 'Expand menu' : 'Collapse menu');
    labelNavLinks();
    $(window).trigger('resize');
  });
  labelNavLinks();
  if (window.MutationObserver) {
    var navMain = document.querySelector('.left-nav-main');
    if (navMain) {
      new MutationObserver(labelNavLinks).observe(navMain, {childList: true, subtree: true});
    }
  }
</script>
