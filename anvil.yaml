allow_embedding: false
db_schema:
  colors:
    client: none
    columns:
    - {name: code, type: string}
    - {name: label_code, type: string}
    - {name: name, type: string}
    - {name: label, type: string}
    - {name: shade, type: string}
    - {name: account, type: string}
    - {name: notes, type: string}
    - {name: datasheet_link, type: string}
    - {name: in_catalog, type: bool}
    server: full
    title: Colors
  materials:
    client: none
    columns:
    - {name: code, type: string}
    - {name: grade, type: string}
    - {name: kind, type: string}
    - {name: supplier, type: string}
    - {name: family, type: string}
    - {name: mfi, type: number}
    - {name: account, type: string}
    - {name: invoice_code, type: string}
    - {name: description, type: string}
    - {name: notes, type: string}
    - {name: datasheet_link, type: string}
    - {name: in_catalog, type: bool}
    server: full
    title: Raw materials
  molds:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: product, target: products, type: link_single}
    - {name: cavities, type: number}
    - {name: shot_weight_g, type: number}
    - {name: location, type: string}
    - {name: status, type: string}
    server: full
    title: Molds
  presses:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: alias, type: string}
    - {name: floor_number, type: number}
    - {name: serial, type: string}
    - {name: robot, type: string}
    - {name: robot_serial, type: string}
    - {name: robot_year, type: string}
    - {name: euromap, type: string}
    - {name: changeover_min, type: number}
    - {name: lifecycle, type: string}
    - {name: mounted_product, target: products, type: link_single}
    - {name: board_location, type: string}
    - {name: board_note, type: string}
    server: full
    title: Presses
  production_runs:
    client: none
    columns:
    - {name: recipe, target: recipes, type: link_single}
    - {name: operator, target: workers, type: link_single}
    - {name: position, type: number}
    - {name: start_date, type: date}
    - {name: start_time, type: string}
    - {name: end_date, type: date}
    - {name: end_time, type: string}
    - {name: shift, type: string}
    - {name: good, type: number}
    - {name: scrap, type: number}
    - {name: scrap_reason, type: string}
    - {name: cycle_s, type: number}
    - {name: cavities, type: number}
    - {name: lot, type: string}
    - {name: order_no, type: string}
    - {name: notes, type: string}
    - {name: sample, type: bool}
    server: full
    title: Production runs
  products:
    client: none
    columns:
    - {name: code, type: string}
    - {name: name, type: string}
    - {name: sheet_id, type: number}
    - {name: erp_code, type: string}
    - {name: item_type, type: string}
    - {name: lifecycle, type: string}
    - {name: only_on_cards, type: bool}
    - {name: notes, type: string}
    - {name: approved_presses, target: presses, type: link_multiple}
    - {name: lid, target: products, type: link_single}
    - {name: lid_basis, type: string}
    server: full
    title: Products
  recipe_colors:
    client: none
    columns:
    - {name: recipe, target: recipes, type: link_single}
    - {name: color, target: colors, type: link_single}
    - {name: slot, type: number}
    - {name: lot, type: string}
    server: full
    title: Recipe colors
  recipe_materials:
    client: none
    columns:
    - {name: recipe, target: recipes, type: link_single}
    - {name: material, target: materials, type: link_single}
    - {name: slot, type: number}
    - {name: lot, type: string}
    server: full
    title: Recipe raw materials
  recipes:
    client: none
    columns:
    - {name: code, type: string}
    - {name: sheet_row, type: number}
    - {name: mold, target: molds, type: link_single}
    - {name: press, target: presses, type: link_single}
    - {name: trial, type: bool}
    - {name: standard, type: bool}
    - {name: cycle_s, type: number}
    - {name: cooling_s, type: number}
    - {name: screw_rpm, type: number}
    - {name: temp_nozzle, type: number}
    - {name: temp_1, type: number}
    - {name: temp_2, type: number}
    - {name: temp_3, type: number}
    - {name: temp_4, type: number}
    - {name: temp_5, type: number}
    - {name: temp_6, type: number}
    - {name: px, type: number}
    - {name: py, type: number}
    - {name: product_lot, type: string}
    - {name: print_pieces, type: number}
    - {name: print_total, type: number}
    - {name: status_note, type: string}
    - {name: comment, type: string}
    - {name: settings_note, type: string}
    - {name: injection, type: simpleObject}
    - {name: as_written, type: simpleObject}
    server: full
    title: Recipes
  stoppages:
    client: none
    columns:
    - {name: recipe, target: recipes, type: link_single}
    - {name: worker, target: workers, type: link_single}
    - {name: position, type: number}
    - {name: start_date, type: date}
    - {name: start_time, type: string}
    - {name: end_date, type: date}
    - {name: end_time, type: string}
    - {name: cause, type: string}
    - {name: fix, type: string}
    server: full
    title: Stoppages
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: email
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: true
      name: enabled
      type: bool
    - admin_ui: {order: 2, width: 200}
      client_hidden: true
      name: last_login
      type: datetime
    - admin_ui: {order: 3, width: 200}
      client_hidden: true
      name: password_hash
      type: string
    - admin_ui: {order: 4, width: 200}
      client_hidden: true
      name: n_password_failures
      type: number
    - admin_ui: {order: 5, width: 200}
      client_hidden: true
      name: signed_up
      type: datetime
    - admin_ui: {order: 6, width: 200}
      client_hidden: true
      name: remembered_logins
      type: simpleObject
    - admin_ui: {order: 7, width: 200}
      client_hidden: true
      name: confirmed_email
      type: bool
    indexes: []
    server: full
    title: Users
  workers:
    client: none
    columns:
    - {name: name, type: string}
    server: full
    title: Workers
dependencies:
- dep_id: dep_wkevhfjmozeq0f
  resolution_hints: {app_id: ST3GINETRT4QJYDC, name: craftify-library, package_name: craftify_library}
  version: {branch: master}
metadata: {description: Cyclops production records, title: Cyclops}
name: cyclops_app
native_deps:
  head_html: |
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/treant-js@1.0.1/Treant.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="_/theme/echarts_theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/treant-js@1.0.1/vendor/raphael.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/treant-js@1.0.1/Treant.js"></script>
    <script src="_/theme/cyclops-tree.js"></script>
    <script>
    (function () {
      try {
        var stored = localStorage.getItem("craftify-theme") || "light";
        var dark = stored === "dark" || (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("ipac-dark", dark);
        document.documentElement.classList.toggle("craftify-theme-dark", dark);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
    </script>
    <link rel="stylesheet" href="_/theme/craftify-full-theme.css">
    <link rel="stylesheet" href="_/theme/tabulator_styles.css">
    <link rel="stylesheet" href="_/theme/coach.css">
    <link rel="stylesheet" href="_/theme/craftify-theme.css">
    <link rel="stylesheet" href="_/theme/cyclops.css">
package_name: cyclops_app
runtime_options:
  client_version: '3'
  server_spec: {base: python312}
  version: 3
services:
- client_config: {enable_split: true, enable_v2: true}
  server_config: {auto_create_missing_columns: true}
  source: /runtime/services/tables.yml
- client_config: {allow_remember_me: true, allow_signup: true, confirm_email: true, enable_automatic_sign_in: true, mfa_timeout_days: 0, remember_me_days: 30, require_mfa: false, use_email: true, use_google: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup: {module: launch, type: module}
startup_form: null
