# The rented machine. Caddy terminates HTTPS. The app stays on plain HTTP inside the network.
# Caps fit a 2-vCPU, 4 GB host: the database keeps a whole CPU, which is what a pieces-per-hour sort fills.

name: cyclops-prod

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cyclops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cyclops
    volumes:
      - cyclops-prod-db:/var/lib/postgresql/data
      - ./db/plant.sql:/docker-entrypoint-initdb.d/10-plant.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyclops -d cyclops"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANVIL_ORIGIN: ${ANVIL_ORIGIN}
      ANVIL_PORT: "3040"
      POSTGRES_USER: cyclops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cyclops
      CYCLOPS_DATABASE_URL: postgresql://cyclops:${POSTGRES_PASSWORD}@db:5432/cyclops
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_APP_ID: ${MICROSOFT_APP_ID}
      MICROSOFT_APP_SECRET: ${MICROSOFT_APP_SECRET}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

volumes:
  cyclops-prod-db:
  caddy-data:
  caddy-config:
